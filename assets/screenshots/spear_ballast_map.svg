<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1184" width="1560"><rect width="1560" height="1184" fill="#0b0b10"/><text x="34.0" y="48.0" fill="#f2f2f5" font-size="34" font-weight="800" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">Что балласт делает с точкой хвата</text><text x="34.0" y="82.0" fill="#8b8b98" font-size="20" font-weight="400" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">Для перекрута рука должна стоять в центре тяжести. Взяться можно только за рукоятку — 220…1056 мм.</text><text x="34.0" y="108.0" fill="#8b8b98" font-size="20" font-weight="400" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">Пока баланс выше 1056, рука упирается в венец и до него не доходит. Балласт опускает баланс внутрь рукоятки — но растит инерцию.</text><text x="34.0" y="168.0" fill="#8b8b98" font-size="17" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">вариант</text><text x="300.0" y="168.0" fill="#8b8b98" font-size="16" font-weight="400" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">пятка</text><text x="1080.0" y="168.0" fill="#8b8b98" font-size="16" font-weight="400" text-anchor="end" font-family="Segoe UI, Roboto, Arial, sans-serif">кончик</text><text x="1108.0" y="168.0" fill="#8b8b98" font-size="17" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">масса</text><text x="1216.0" y="168.0" fill="#8b8b98" font-size="17" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">хват</text><text x="1318.0" y="168.0" fill="#8b8b98" font-size="17" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">инерция</text><text x="1438.0" y="168.0" fill="#8b8b98" font-size="17" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">оборотов</text><text x="1438.0" y="188.0" fill="#8b8b98" font-size="14" font-weight="400" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">за финал 1.15 с</text><rect x="24" y="194" width="1512" height="108" fill="#5ddb9a" opacity="0.09" rx="9"/><line x1="24" y1="192" x2="1536" y2="192" stroke="#262633"/><text x="34.0" y="238.0" fill="#f2f2f5" font-size="19" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">ничего не добавлять</text><text x="34.0" y="264.0" fill="#5ddb9a" font-size="17" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">рекомендую</text><rect x="300.0" y="235.0" width="780.0" height="14" fill="#16161d" stroke="#262633" rx="4"/><rect x="300.0" y="235.0" width="95.3" height="14" fill="#ff5b5d" opacity="0.22"/><rect x="395.3" y="235.0" width="362.3" height="14" fill="#69dcff" opacity="0.42"/><rect x="757.6" y="235.0" width="322.4" height="14" fill="#ff5b5d" opacity="0.22"/><circle cx="769.0" cy="242.0" r="9" fill="none" stroke="#ffc83d" stroke-width="3"/><circle cx="769.0" cy="242.0" r="3" fill="#ffc83d"/><circle cx="757.6" cy="242.0" r="17" fill="#69dcff" opacity="0.28"/><circle cx="757.6" cy="242.0" r="17" fill="none" stroke="#69dcff" stroke-width="3.5"/><text x="783.0" y="228.0" fill="#ffc83d" font-size="14" font-weight="600" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">не достать</text><text x="1108.0" y="240.0" fill="#f2f2f5" font-size="19" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">1608 г</text><text x="1216.0" y="240.0" fill="#69dcff" font-size="19" font-weight="700" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">1056</text><text x="1216.0" y="262.0" fill="#8b8b98" font-size="15" font-weight="400" text-anchor="start" font-family="Segoe UI, Roboto, Arial, sans-serif">круг 2.11 м</text><rect x="1318" y="231" width="40.7" height="15" fill="#5ddb9a" rx="3"/><text x="1318.0" y="264.0" fill="#5ddb9a" font-size="15" font-weight="600" text-anchor=